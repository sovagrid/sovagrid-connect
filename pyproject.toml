[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sovagrid-connect"
version = "0.6.0"
description = "Desktop SSH connector for the full SovaGrid web panel"
requires-python = ">=3.9"
dependencies = []
license = {file = "LICENSE"}
authors = [{name = "Jigokuraku01"}]

[project.urls]
Source = "https://github.com/sovagrid/sovagrid-connect"

[project.scripts]
sovagrid-connect = "sovagrid_connect.__main__:main"

[tool.setuptools.packages.find]
include = ["sovagrid_connect*"]

[tool.setuptools.package-data]
sovagrid_connect = ["legal/*", "legal/third-party/*"]
